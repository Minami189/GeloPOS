<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>GeloPOS - Tablet POS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="theme-color" content="#3b82f6" />
    <style>
      body { background-color: #0d1117; color: white; margin: 0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
      #root { display: none; width: 100%; height: 100vh; }
      #gatekeeper { text-align: center; padding: 20px; display: none; }
      #gatekeeper h1 { font-size: 24px; margin-bottom: 10px; color: #3b82f6; }
      #gatekeeper p { font-size: 16px; color: #8899a6; max-width: 400px; margin: 0 auto 20px; }
      #gatekeeper .icon { font-size: 48px; margin-bottom: 20px; }
    </style>
    <script>
      (function() {
        // Detect Standalone Mode (PWA, iOS, or Electron)
        const isStandalone = 
          window.matchMedia('(display-mode: standalone)').matches || 
          window.navigator.standalone || 
          navigator.userAgent.includes('Electron') ||
          document.referrer.includes('android-app://');
        
        window.isGeloPOSApp = isStandalone;

        window.addEventListener('DOMContentLoaded', () => {
          if (isStandalone) {
            document.getElementById('root').style.display = 'flex';
          } else {
            document.getElementById('gatekeeper').style.display = 'block';
            // Stop other scripts from running
            window.stop();
          }
        });
      })();
    </script>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="gatekeeper">
      <div class="icon">🚫</div>
      <h1>GeloPOS Access Required</h1>
      <p>This application is exclusive to the GeloPOS PWA. To access the POS, please follow these steps:</p>
      <div style="background: #161b22; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px;">
        1. Open this URL in Chrome or Safari.<br><br>
        2. Tap the <b>Add to Home Screen</b> or <b>Install App</b> button in your browser menu.<br><br>
        3. Launch <b>GeloPOS</b> from your device's home screen.
      </div>
    </div>

    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('SW registered: ', registration);
          }, (err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
